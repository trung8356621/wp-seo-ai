name: Release wp-seo-ai

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump level
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Plan only (no version write / commit / tag / push / GitHub Release)
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: wp-seo-ai-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Need a token that can push commits/tags back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — ref must be main
        run: |
          set -euo pipefail
          BRANCH="$(git branch --show-current)"
          if [ "$BRANCH" != "main" ]; then
            echo "RELEASE FAILED: must run on main (got: ${BRANCH})"
            exit 1
          fi
          echo "branch=main OK"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip
          coverage: none

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Dry-run release plan
        if: ${{ inputs.dry_run }}
        run: php bin/release.php --dry-run --bump=${{ inputs.bump }}

      - name: Execute release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIST_ROOT: ${{ runner.temp }}/wp-seo-ai-dist
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIST_ROOT"
          php bin/release.php --execute --bump=${{ inputs.bump }} --dist="$RELEASE_DIST_ROOT"
